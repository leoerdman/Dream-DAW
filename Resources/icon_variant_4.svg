<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background: near-black with subtle warm tint -->
    <radialGradient id="bgGrad4" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#1a1a2a"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    <!-- Multi-color subtle glow -->
    <radialGradient id="glow4a" cx="0.35" cy="0.45" r="0.35">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow4b" cx="0.65" cy="0.55" r="0.3">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <!-- Note gradient: white with subtle violet -->
    <linearGradient id="noteGrad4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f0e6ff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="shadow4">
      <feDropShadow dx="0" dy="6" stdDeviation="18" flood-color="#a78bfa" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="border4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="50%" stop-color="rgba(139,92,246,0.1)"/>
      <stop offset="100%" stop-color="rgba(236,72,153,0.05)"/>
    </linearGradient>
  </defs>

  <!-- macOS rounded rect -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#bgGrad4)"/>
  <rect x="1.5" y="1.5" width="1021" height="1021" rx="227" ry="227" fill="none" stroke="url(#border4)" stroke-width="1.5"/>

  <!-- Dual glows -->
  <circle cx="360" cy="460" r="300" fill="url(#glow4a)"/>
  <circle cx="664" cy="560" r="260" fill="url(#glow4b)"/>

  <!-- Single quarter note — centered, elegant -->
  <g filter="url(#shadow4)">
    <!-- Note head -->
    <ellipse cx="490" cy="610" rx="76" ry="56" transform="rotate(-22, 490, 610)" fill="url(#noteGrad4)"/>
    <!-- Stem -->
    <rect x="552" y="285" width="16" height="342" rx="8" fill="url(#noteGrad4)"/>
    <!-- Flag 1 -->
    <path d="M 568 285 C 568 285, 660 320, 670 390 C 675 420, 640 435, 568 395" 
          fill="url(#noteGrad4)"/>
    <!-- Flag 2 -->
    <path d="M 568 355 C 568 355, 650 385, 660 440 C 664 465, 635 475, 568 445" 
          fill="url(#noteGrad4)"/>
  </g>
</svg>
