    <line x1="-240" y1="0" x2="-240" y2="40"/>
    <line x1="-210" y1="0" x2="-210" y2="90"/>
    <line x1="-180" y1="0" x2="-180" y2="60"/>
    <line x1="-150" y1="0" x2="-150" y2="130"/>
    <line x1="-120" y1="0" x2="-120" y2="180"/>
