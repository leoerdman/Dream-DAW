[workspace]
members = [
    "core/dream_models",
    "core/dream_importers",
    "core/dream_mutators",
    "core/dream_ipc",
    "core/dream_graph",
    "core/dream_dsp",
    "core/dream_engine",
    "core/dream_renderer",
    "core/dream_plugins",
    "core/dream_io",
    "core/dream_mixer",
    "core/dream_transport",
    "core/dream_clip_engine",
    "core/dream_automation",
    "core/dream_orchestrator",
    "apps/desktop_host",
    "apps/plugin_host_daemon", "rubato_test_project",
]
resolver = "3"

[workspace.package]
version = "1.0.500"
edition = "2024"
license = "Proprietary"

# ── Shared Dependencies ──────────────────────────────────────────────────
# All crates inherit these versions via `workspace = true` in their own Cargo.toml.
# This ensures version consistency across the entire monorepo.
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
ts-rs = { version = "12.0", features = ["serde-compat", "uuid-impl"] }
uuid = { version = "1.0", features = ["v4", "v5", "serde"] }
rtrb = "0.3"
rubato = "0.16"
cpal = "0.17"
log = "0.4"
env_logger = "0.11"
wgpu = "24"
bytemuck = { version = "1.21", features = ["derive"] }
symphonia = { version = "0.5", features = ["all"] }
hound = "3.5"
mp3lame-encoder = "0.2"
parking_lot = "0.12"
arc-swap = "1.7"
rustfft = "6.4"
libloading = "0.8"
num-traits = "0.2"

# ── Release Profile (Enterprise) ────────────────────────────────────────
# These optimizations apply to ALL crates in the workspace when built with --release.
[profile.release]
opt-level = 3          # Maximum LLVM optimization level
lto = "fat"            # Cross-crate Link-Time Optimization
codegen-units = 1      # Single codegen unit = best optimization
strip = "symbols"      # Strip debug symbols from binary
panic = "abort"        # No stack unwinding — smaller binary, no catch_unwind overhead
