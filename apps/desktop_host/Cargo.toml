[package]
name = "desktop_host"
description = "Dream DAW — Tauri v2 Desktop Shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
cargo-clippy = []

[[bin]]
name = "desktop_host"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { workspace = true }
serde_json = "1.0"
bytemuck = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
rtrb = { workspace = true }
arc-swap = { workspace = true }

# Dream DAW core crates
dream_models = { path = "../../core/dream_models" }
dream_importers = { path = "../../core/dream_importers" }
dream_mutators = { path = "../../core/dream_mutators" }
dream_orchestrator = { path = "../../core/dream_orchestrator" }
dream_ipc = { path = "../../core/dream_ipc" }
dream_engine = { path = "../../core/dream_engine" }
dream_dsp = { path = "../../core/dream_dsp" }
dream_graph = { path = "../../core/dream_graph" }
dream_io = { path = "../../core/dream_io" }
dream_clip_engine = { path = "../../core/dream_clip_engine" }
dream_plugins = { path = "../../core/dream_plugins" }

# Project management
uuid = { workspace = true }
base64 = "0.22"
dirs = "5"
tauri-plugin-dialog = "2"
midir = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
flate2 = "1.0"
quick-xml = "0.38"
roxmltree = "0.20"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"
block = "0.1"
