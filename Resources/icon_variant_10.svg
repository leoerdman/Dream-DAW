<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg10" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#12061e"/>
    </linearGradient>
    <radialGradient id="glow10" cx="50%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg10)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#glow10)"/>
  <!-- Vinyl record -->
  <circle cx="512" cy="512" r="260" fill="none" stroke="white" stroke-width="2" opacity="0.08"/>
  <circle cx="512" cy="512" r="230" fill="none" stroke="white" stroke-width="1.5" opacity="0.06"/>
  <circle cx="512" cy="512" r="200" fill="none" stroke="white" stroke-width="1.5" opacity="0.06"/>
  <circle cx="512" cy="512" r="170" fill="none" stroke="white" stroke-width="1.5" opacity="0.06"/>
  <circle cx="512" cy="512" r="140" fill="none" stroke="white" stroke-width="1.5" opacity="0.06"/>
  <circle cx="512" cy="512" r="110" fill="none" stroke="white" stroke-width="1.5" opacity="0.06"/>
  <circle cx="512" cy="512" r="80" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.3"/>
  <!-- Inner label -->
  <circle cx="512" cy="512" r="60" fill="#a855f7" opacity="0.2"/>
  <circle cx="512" cy="512" r="8" fill="#a855f7" opacity="0.6"/>
  <!-- Outer rim -->
  <circle cx="512" cy="512" r="280" fill="none" stroke="#a855f7" stroke-width="3" opacity="0.2"/>
  <!-- Tonearm -->
  <line x1="700" y1="260" x2="560" y2="440" stroke="white" stroke-width="4" opacity="0.3" stroke-linecap="round"/>
  <circle cx="700" cy="260" r="12" fill="white" opacity="0.15"/>
  <circle cx="560" cy="440" r="6" fill="#a855f7" opacity="0.5"/>
</svg>
