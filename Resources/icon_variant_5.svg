    <line x1="-60" y1="0" x2="-60" y2="200"/>
    <line x1="-30" y1="0" x2="-30" y2="160"/>
    <line x1="0" y1="0" x2="0" y2="220"/>
    <line x1="30" y1="0" x2="30" y2="170"/>
    <line x1="60" y1="0" x2="60" y2="190"/>
    <line x1="90" y1="0" x2="90" y2="150"/>
