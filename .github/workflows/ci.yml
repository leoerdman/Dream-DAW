name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  rust:
    name: Rust Tribunal
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo fmt (check)
        run: cargo fmt --check

      - name: Cargo clippy (workspace, deny warnings)
        run: |
          cargo clippy --workspace --all-targets -- -D warnings \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::todo \
            -D clippy::dbg_macro

      - name: Cargo test (workspace, release)
        run: cargo test --workspace --release

      - name: Audio null-test infrastructure
        run: cargo test -p dream_engine null_math_ -- --nocapture

      - name: Architecture budget report
        run: |
          bash ./scripts/architecture_budget.sh --report /tmp/architecture_budget.txt
          cat /tmp/architecture_budget.txt
          {
            echo "## Architecture Budget Report"
            echo ""
            echo '```text'
            cat /tmp/architecture_budget.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload architecture budget artifact
        uses: actions/upload-artifact@v4
        with:
          name: architecture-budget
          path: /tmp/architecture_budget.txt

      - name: SSOT bindings guard
        run: ./scripts/check_ssot_bindings.sh

      - name: SSOT alias/import guard
        run: ./scripts/ssot_guard.sh

  frontend:
    name: Frontend Type Tribunal
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install UI deps
        run: pnpm -C frontend/ui_app install --frozen-lockfile

      - name: Regenerate Rust -> TS bindings (SSOT)
        run: pnpm -C frontend/ui_app run sync:bindings

      - name: SSOT bindings guard
        run: ./scripts/check_ssot_bindings.sh

      - name: TypeScript noEmit
        run: pnpm -C frontend/ui_app exec tsc --noEmit
