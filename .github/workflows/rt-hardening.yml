name: rt-hardening

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

jobs:
  headless-fuzz:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run headless fuzz gate
        run: bash scripts/headless_fuzz_gate.sh

  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Run sanitizer gate
        run: bash scripts/sanitizer_gate.sh
