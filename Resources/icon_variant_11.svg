<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg11" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <radialGradient id="glow11" cx="50%" cy="55%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg11)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#glow11)"/>
  <!-- EQ Curve -->
  <g transform="translate(0,0)">
    <path d="M200,580 Q280,580 320,520 Q360,460 400,500 Q440,540 480,420 Q520,300 560,380 Q600,460 640,440 Q680,420 720,460 Q760,500 820,480" 
          fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
    <!-- Grid lines -->
    <line x1="200" y1="350" x2="820" y2="350" stroke="white" stroke-width="1" opacity="0.05"/>
    <line x1="200" y1="430" x2="820" y2="430" stroke="white" stroke-width="1" opacity="0.05"/>
    <line x1="200" y1="510" x2="820" y2="510" stroke="white" stroke-width="1" opacity="0.05"/>
    <line x1="200" y1="590" x2="820" y2="590" stroke="white" stroke-width="1" opacity="0.05"/>
    <!-- Fill below curve -->
    <path d="M200,580 Q280,580 320,520 Q360,460 400,500 Q440,540 480,420 Q520,300 560,380 Q600,460 640,440 Q680,420 720,460 Q760,500 820,480 L820,670 L200,670 Z" 
          fill="#10b981" opacity="0.1"/>
    <!-- Control points -->
    <circle cx="320" cy="520" r="8" fill="#34d399" opacity="0.6"/>
    <circle cx="480" cy="420" r="8" fill="#34d399" opacity="0.6"/>
    <circle cx="560" cy="380" r="8" fill="#34d399" opacity="0.6"/>
    <circle cx="720" cy="460" r="8" fill="#34d399" opacity="0.6"/>
  </g>
  <!-- Frequency labels -->
  <text x="260" y="700" font-family="Helvetica Neue" font-size="28" fill="white" opacity="0.15">20</text>
  <text x="430" y="700" font-family="Helvetica Neue" font-size="28" fill="white" opacity="0.15">200</text>
  <text x="600" y="700" font-family="Helvetica Neue" font-size="28" fill="white" opacity="0.15">2k</text>
  <text x="770" y="700" font-family="Helvetica Neue" font-size="28" fill="white" opacity="0.15">20k</text>
</svg>
