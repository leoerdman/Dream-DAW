[workspace]
members = [
    "core/dream_models",
    "core/dream_ipc",
    "core/dream_graph",
    "core/dream_engine",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Proprietary"

# ── Shared Dependencies ──────────────────────────────────────────────────
# All crates inherit these versions via `workspace = true` in their own Cargo.toml.
# This ensures version consistency across the entire monorepo.
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
ts-rs = { version = "12.0", features = ["serde-compat"] }
rtrb = "0.3"
cpal = "0.17"
log = "0.4"
env_logger = "0.11"

# ── Release Profile (Enterprise) ────────────────────────────────────────
# These optimizations apply to ALL crates in the workspace when built with --release.
[profile.release]
opt-level = 3          # Maximum LLVM optimization level
lto = "fat"            # Cross-crate Link-Time Optimization
codegen-units = 1      # Single codegen unit = best optimization
strip = "symbols"      # Strip debug symbols from binary
panic = "abort"        # No stack unwinding — smaller binary, no catch_unwind overhead
