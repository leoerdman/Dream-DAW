<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg13" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#0a0812"/>
      <stop offset="100%" stop-color="#120824"/>
    </linearGradient>
    <radialGradient id="glow13" cx="50%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg13)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#glow13)"/>
  <!-- Musical staff lines -->
  <g stroke="white" stroke-width="2" opacity="0.08">
    <line x1="180" y1="370" x2="844" y2="370"/>
    <line x1="180" y1="420" x2="844" y2="420"/>
    <line x1="180" y1="470" x2="844" y2="470"/>
    <line x1="180" y1="520" x2="844" y2="520"/>
    <line x1="180" y1="570" x2="844" y2="570"/>
  </g>
  <!-- Treble clef -->
  <g transform="translate(280,470)" fill="#fbbf24" opacity="0.8">
    <text font-family="serif" font-size="260" text-anchor="middle" y="40">𝄞</text>
  </g>
  <!-- Notes on the staff -->
  <g fill="#fbbf24" opacity="0.5">
    <ellipse cx="500" cy="520" rx="18" ry="14" transform="rotate(-15,500,520)"/>
    <line x1="518" y1="520" x2="518" y2="380" stroke="#fbbf24" stroke-width="4"/>
    <ellipse cx="600" cy="470" rx="18" ry="14" transform="rotate(-15,600,470)"/>
    <line x1="618" y1="470" x2="618" y2="330" stroke="#fbbf24" stroke-width="4"/>
    <ellipse cx="700" cy="420" rx="18" ry="14" transform="rotate(-15,700,420)"/>
    <line x1="718" y1="420" x2="718" y2="280" stroke="#fbbf24" stroke-width="4"/>
  </g>
</svg>
