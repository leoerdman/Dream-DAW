name: rt-hardening

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "core/**"
      - "apps/plugin_host_daemon/**"
      - "scripts/sanitizer_gate.sh"
      - "scripts/headless_fuzz_gate.sh"
      - ".github/workflows/rt-hardening.yml"
  schedule:
    - cron: "0 9 * * 1"

concurrency:
  group: rt-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless-fuzz-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run headless fuzz smoke gate
        env:
          DREAM_FUZZ_MODE: smoke
        run: bash scripts/headless_fuzz_gate.sh

  sanitizers-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Run sanitizer smoke gate
        env:
          DREAM_SANITIZER_MODE: smoke
        run: bash scripts/sanitizer_gate.sh

  headless-fuzz:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run headless fuzz gate
        run: bash scripts/headless_fuzz_gate.sh

  sanitizers:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Run sanitizer gate
        run: bash scripts/sanitizer_gate.sh
