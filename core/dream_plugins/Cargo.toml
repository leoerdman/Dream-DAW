[package]
name = "dream_plugins"
description = "Dream DAW — Plugin Hosting Foundation (VST3/CLAP/AU)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Example harnesses are experimental and not part of production CI.
plugin_examples = []

[dependencies]
serde = { workspace = true }
serde_json = "1.0"
uuid = { workspace = true }
log = { workspace = true }
libloading = { workspace = true }
parking_lot = "0.12"
memmap2 = "0.9"
bytemuck = { workspace = true }

dream_models = { path = "../dream_models" }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"

[dev-dependencies]
env_logger = { workspace = true }

[[example]]
name = "test_all_vst3"
required-features = ["plugin_examples"]

[[example]]
name = "test_serum2"
required-features = ["plugin_examples"]

[[example]]
name = "test_vst2_headless"
required-features = ["plugin_examples"]

[[example]]
name = "test_vst2_scan"
required-features = ["plugin_examples"]

[[example]]
name = "test_vst2_timeout"
required-features = ["plugin_examples"]
