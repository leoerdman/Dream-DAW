<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#0f0a20"/>
      <stop offset="100%" stop-color="#14081e"/>
    </linearGradient>
    <radialGradient id="glow7" cx="45%" cy="55%" r="38%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg7)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#glow7)"/>
  <!-- Piano keys perspective -->
  <g transform="translate(280,350)">
    <!-- White keys -->
    <rect x="0" y="0" width="66" height="300" rx="6" fill="white" opacity="0.85"/>
    <rect x="70" y="0" width="66" height="300" rx="6" fill="white" opacity="0.85"/>
    <rect x="140" y="0" width="66" height="300" rx="6" fill="white" opacity="0.85"/>
    <rect x="210" y="0" width="66" height="300" rx="6" fill="white" opacity="0.85"/>
    <rect x="280" y="0" width="66" height="300" rx="6" fill="white" opacity="0.85"/>
    <rect x="350" y="0" width="66" height="300" rx="6" fill="white" opacity="0.85"/>
    <rect x="420" y="0" width="66" height="300" rx="6" fill="white" opacity="0.85"/>
    <!-- Black keys -->
    <rect x="45" y="0" width="40" height="190" rx="5" fill="#1a1a1a"/>
    <rect x="115" y="0" width="40" height="190" rx="5" fill="#1a1a1a"/>
    <rect x="255" y="0" width="40" height="190" rx="5" fill="#1a1a1a"/>
    <rect x="325" y="0" width="40" height="190" rx="5" fill="#1a1a1a"/>
    <rect x="395" y="0" width="40" height="190" rx="5" fill="#1a1a1a"/>
  </g>
  <!-- Glow on pressed key -->
  <rect x="420" y="350" width="66" height="300" rx="6" fill="#f59e0b" opacity="0.3"/>
</svg>
