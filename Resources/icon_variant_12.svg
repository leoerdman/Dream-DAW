<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg12" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08080e"/>
      <stop offset="100%" stop-color="#0e0820"/>
    </linearGradient>
    <radialGradient id="glow12" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg12)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#glow12)"/>
  <!-- Microphone -->
  <g transform="translate(512,460)">
    <!-- Mic body -->
    <rect x="-40" y="-160" width="80" height="200" rx="40" fill="none" stroke="#fb7185" stroke-width="8"/>
    <!-- Mic grille lines -->
    <line x1="-30" y1="-120" x2="30" y2="-120" stroke="#fb7185" stroke-width="2" opacity="0.3"/>
    <line x1="-30" y1="-90" x2="30" y2="-90" stroke="#fb7185" stroke-width="2" opacity="0.3"/>
    <line x1="-30" y1="-60" x2="30" y2="-60" stroke="#fb7185" stroke-width="2" opacity="0.3"/>
    <!-- Mic mount arc -->
    <path d="M-80,20 Q-80,100 0,100 Q80,100 80,20" fill="none" stroke="#fb7185" stroke-width="6" stroke-linecap="round"/>
    <!-- Stand -->
    <line x1="0" y1="100" x2="0" y2="200" stroke="#fb7185" stroke-width="6" stroke-linecap="round"/>
    <line x1="-50" y1="200" x2="50" y2="200" stroke="#fb7185" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- Sound ripples -->
  <g transform="translate(512,400)" stroke="#fb7185" fill="none" opacity="0.2">
    <path d="M80,-50 C110,-80 110,-120 80,-150" stroke-width="4"/>
    <path d="M100,-30 C140,-80 140,-140 100,-180" stroke-width="3"/>
    <path d="M-80,-50 C-110,-80 -110,-120 -80,-150" stroke-width="4"/>
    <path d="M-100,-30 C-140,-80 -140,-140 -100,-180" stroke-width="3"/>
  </g>
</svg>
