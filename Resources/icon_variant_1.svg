<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background gradient: deep black to dark charcoal -->
    <linearGradient id="bgGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <!-- Note glow -->
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <!-- Note gradient: white to light blue -->
    <linearGradient id="noteGrad1" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <!-- Subtle border -->
    <linearGradient id="border1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
    <filter id="innerGlow1" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- macOS rounded rect background -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#bgGrad1)"/>
  
  <!-- Subtle border -->
  <rect x="2" y="2" width="1020" height="1020" rx="226" ry="226" fill="none" stroke="url(#border1)" stroke-width="2"/>

  <!-- Ambient glow behind note -->
  <circle cx="512" cy="520" r="280" fill="url(#glow1)"/>

  <!-- Musical note (beamed eighth notes ♫) -->
  <g filter="url(#shadow1)">
    <!-- Left note head -->
    <ellipse cx="370" cy="640" rx="58" ry="44" transform="rotate(-15, 370, 640)" fill="url(#noteGrad1)"/>
    <!-- Right note head -->
    <ellipse cx="654" cy="600" rx="58" ry="44" transform="rotate(-15, 654, 600)" fill="url(#noteGrad1)"/>
    <!-- Left stem -->
    <rect x="416" y="320" width="14" height="332" rx="7" fill="url(#noteGrad1)"/>
    <!-- Right stem -->
    <rect x="700" y="280" width="14" height="332" rx="7" fill="url(#noteGrad1)"/>
    <!-- Beam (connecting bar) -->
    <path d="M 416 320 L 714 280 L 714 308 L 416 348 Z" fill="url(#noteGrad1)"/>
    <!-- Second beam -->
    <path d="M 416 370 L 714 330 L 714 358 L 416 398 Z" fill="url(#noteGrad1)"/>
  </g>
</svg>
