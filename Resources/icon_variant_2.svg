<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background: pure black to dark gray -->
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d2d3a"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <!-- Cyan-teal accent glow -->
    <radialGradient id="glow2" cx="0.5" cy="0.48" r="0.45">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <!-- Note gradient: bright white to cyan -->
    <linearGradient id="noteGrad2" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="border2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>
  </defs>

  <!-- macOS rounded rect -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#bgGrad2)"/>
  <rect x="1.5" y="1.5" width="1021" height="1021" rx="227" ry="227" fill="none" stroke="url(#border2)" stroke-width="1.5"/>

  <!-- Glow -->
  <circle cx="512" cy="490" r="320" fill="url(#glow2)"/>

  <!-- Single elegant quarter note ♩ -->
  <g filter="url(#shadow2)">
    <!-- Note head -->
    <ellipse cx="480" cy="620" rx="72" ry="54" transform="rotate(-20, 480, 620)" fill="url(#noteGrad2)"/>
    <!-- Stem -->
    <rect x="538" y="295" width="16" height="340" rx="8" fill="url(#noteGrad2)"/>
    <!-- Flag (elegant curve) -->
    <path d="M 554 295 C 554 295, 640 340, 640 420 C 640 460, 600 470, 554 430" 
          fill="url(#noteGrad2)" stroke="none"/>
  </g>
</svg>
