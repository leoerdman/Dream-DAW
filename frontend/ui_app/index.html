<!doctype html>
<html lang="en" style="background:#0f0f0f; color-scheme:dark;">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dream DAW</title>
  <style>
    /* Prevent white flash before React mounts */
    html,
    body {
      margin: 0;
      padding: 0;
      background: #0f0f0f;
      overflow: hidden;
    }
  </style>
  <script>
    window.onerror = function(msg, url, line, col, error) {
      document.body.innerHTML += '<div style="color:red;font-family:monospace;padding:20px;z-index:99999;position:absolute;top:0;left:0;background:black;width:100%;height:100%;overflow:auto;"><h2>App Crashed</h2><pre>' + msg + '\\n' + (error && error.stack ? error.stack : '') + '</pre></div>';
    };
    window.addEventListener('unhandledrejection', function(event) {
      document.body.innerHTML += '<div style="color:red;font-family:monospace;padding:20px;z-index:99999;position:absolute;top:0;left:0;background:black;width:100%;height:100%;overflow:auto;"><h2>Unhandled Promise Rejection</h2><pre>' + String(event.reason) + '</pre></div>';
    });
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
