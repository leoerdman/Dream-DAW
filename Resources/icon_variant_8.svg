<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0c18"/>
      <stop offset="100%" stop-color="#180c28"/>
    </linearGradient>
    <radialGradient id="glow8" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg8)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#glow8)"/>
  <!-- Fader / Mixing console -->
  <g transform="translate(512,512)">
    <!-- Fader tracks -->
    <rect x="-200" y="-200" width="8" height="400" rx="4" fill="white" opacity="0.12"/>
    <rect x="-120" y="-200" width="8" height="400" rx="4" fill="white" opacity="0.12"/>
    <rect x="-40" y="-200" width="8" height="400" rx="4" fill="white" opacity="0.12"/>
    <rect x="40" y="-200" width="8" height="400" rx="4" fill="white" opacity="0.12"/>
    <rect x="120" y="-200" width="8" height="400" rx="4" fill="white" opacity="0.12"/>
    <rect x="200" y="-200" width="8" height="400" rx="4" fill="white" opacity="0.12"/>
    <!-- Fader knobs at different heights -->
    <rect x="-214" y="-40" width="36" height="14" rx="4" fill="#f472b6"/>
    <rect x="-134" y="20" width="36" height="14" rx="4" fill="#f472b6"/>
    <rect x="-54" y="-80" width="36" height="14" rx="4" fill="#f472b6"/>
    <rect x="26" y="-20" width="36" height="14" rx="4" fill="#f472b6"/>
    <rect x="106" y="60" width="36" height="14" rx="4" fill="#f472b6"/>
    <rect x="186" y="-60" width="36" height="14" rx="4" fill="#f472b6"/>
    <!-- VU meter bars below -->
    <rect x="-200" y="-40" width="8" height="240" rx="4" fill="#22c55e" opacity="0.35"/>
    <rect x="-120" y="20" width="8" height="180" rx="4" fill="#22c55e" opacity="0.35"/>
    <rect x="-40" y="-80" width="8" height="280" rx="4" fill="#f59e0b" opacity="0.35"/>
    <rect x="40" y="-20" width="8" height="220" rx="4" fill="#22c55e" opacity="0.35"/>
    <rect x="120" y="60" width="8" height="140" rx="4" fill="#22c55e" opacity="0.35"/>
    <rect x="200" y="-60" width="8" height="260" rx="4" fill="#f59e0b" opacity="0.35"/>
  </g>
